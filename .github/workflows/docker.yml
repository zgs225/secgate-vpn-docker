# 构建多架构镜像（linux/amd64 + linux/arm64）并发布到 GitHub Container Registry（ghcr.io）。
#
# 关键点：厂商 deb 不入库，CI 里用 scripts/fetch-client-deb.sh 从官方下载站取包并按 md5
# 校验（命中 actions/cache 时跳过 100 MB 下载）。厂商按架构分别发包：
#   amd64 → 海光麒麟 KYLIN-X86_...deb
#   arm64 → 鲲鹏麒麟 KYLIN-ARM_...deb（飞腾麒麟同一文件）
# Dockerfile 用 buildx 的 TARGETARCH 选包，所以一次构建就出双架构 manifest list。
#
# - push main / tag v*  → ghcr.io/<owner>/<repo>（latest / semver / sha-xxxxxxx）
# - PR                  → 不推送；amd64 载入后跑运行时冒烟，另起原生 arm64 job 跑同样的冒烟
# - workflow_dispatch   → 按分支规则走
name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CLIENT_MD5_AMD64: 49e3472a779e62be596117e4cefaee4a
  CLIENT_MD5_ARM64: 5d3ea8c60927bc902a166f14b6cbacd6

jobs:
  image:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vendor debs
        id: deb-cache
        uses: actions/cache@v4
        with:
          path: vendor/*.deb
          key: vendor-debs-${{ env.CLIENT_MD5_AMD64 }}-${{ env.CLIENT_MD5_ARM64 }}

      - name: Fetch vendor debs
        if: steps.deb-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-client-deb.sh all

      - name: Verify vendor debs
        run: |
          set -euo pipefail
          check() {
            local f=$1 md5=$2 got
            [ -f "$f" ] || { echo "缺少 $f" >&2; exit 1; }
            got=$(md5sum "$f" | awk '{print $1}')
            echo "$f md5=$got"
            [ "$got" = "$md5" ] || { echo "md5 与官方不一致：$f" >&2; exit 1; }
          }
          check vendor/KYLIN-X86_SDWANClient_Setup.deb "$CLIENT_MD5_AMD64"
          check vendor/KYLIN-ARM_SDWANClient_Setup.deb "$CLIENT_MD5_ARM64"
          for f in vendor/*.deb.sha256; do
            [ -e "$f" ] || continue
            ( cd vendor && sha256sum -c "$(basename "$f")" )
          done

      # arm64 的 RUN 步骤（apt / dpkg）在 amd64 runner 上要 qemu 模拟
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 注意：不含客户端版本号 tag —— 两个架构的客户端小版本不同（厂商各自打包）
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Build and push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # PR 不推送，但需要一份能 load 的单架构镜像来做运行时冒烟（缓存命中，很快）
      - name: Build amd64 image for smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --platform linux/amd64 --load \
            --tag secgate-pr:amd64 \
            --build-arg IMAGE_VERSION="${GITHUB_SHA}" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            .

      - name: Smoke test amd64 image
        if: github.event_name == 'pull_request'
        run: ./scripts/smoke-image.sh secgate-pr:amd64

      - name: Summary
        run: |
          {
            echo "### 多架构镜像"
            echo
            echo '```'
            printf '%s\n' "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "平台：linux/amd64（海光麒麟 deb）+ linux/arm64（鲲鹏麒麟 deb）"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-arm64:
    # 原生 arm64 runner（公开仓库免费），用来真跑一次镜像而不是靠 qemu 猜
    name: Native arm64 smoke test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vendor debs
        id: deb-cache
        uses: actions/cache@v4
        with:
          path: vendor/*.deb
          key: vendor-debs-${{ env.CLIENT_MD5_AMD64 }}-${{ env.CLIENT_MD5_ARM64 }}

      - name: Fetch arm64 vendor deb
        if: steps.deb-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch-client-deb.sh arm64

      - name: Verify arm64 vendor deb
        run: |
          set -euo pipefail
          got=$(md5sum vendor/KYLIN-ARM_SDWANClient_Setup.deb | awk '{print $1}')
          echo "md5=$got"
          [ "$got" = "$CLIENT_MD5_ARM64" ] || { echo "md5 与官方不一致" >&2; exit 1; }

      - name: Build arm64 image (native)
        run: docker build --tag secgate-arm64:ci --build-arg IMAGE_VERSION="${GITHUB_SHA}" .

      - name: Smoke test arm64 image
        run: ./scripts/smoke-image.sh secgate-arm64:ci
